{% load static %}
{% include '_icons.svg' %}
<nav id="app-nav">
    <div class="app-navbar-inner">
        <a class="app-navbar-brand" href="{% url 'search_main' %}"><span class="dot"></span> ꓘamerka</a>
        <ul>
            <li><a href="{% url 'search_main' %}">Search</a></li>
            <li><a href="{% url 'index' %}">Dashboard</a></li>
            <li><a href="{% url 'devices' %}">Devices</a></li>
            <li><a href="{% url 'history' %}">History</a></li>
            <li><a href="{% url 'map' %}">Map</a></li>
            <li><a href="{% url 'gallery' %}">Gallery</a></li>
            <li><a href="{% url 'sources' %}">Sources</a></li>
            <li><a href="/admin/logout/">Log out</a></li>
            <li>
                <button type="button" id="km-theme-toggle" class="km-theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme"><svg class="km-icon" aria-hidden="true"><use href="#icon-sun"></use></svg></button>
            </li>
        </ul>
    </div>
</nav>
<script>
(function () {
    // Purely cosmetic: highlight the nav link matching the current page.
    // Does not alter any href/url and never touches app logic.
    try {
        var here = window.location.pathname.replace(/\/+$/, '') || '/';
        var links = document.querySelectorAll('#app-nav ul li a');
        for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href');
            if (!href || href.indexOf('/admin/') === 0) continue;
            var path = href.replace(/\/+$/, '') || '/';
            if (path === here || (path !== '/' && here.indexOf(path) === 0)) {
                links[i].classList.add('km-active');
            }
        }
    } catch (e) {}
})();

(function () {
    // Light/dark theme toggle. Persists in localStorage (per-browser, not
    // shared -- fine for a UI preference); default stays dark (no
    // data-theme attribute, matching kamerka-modern.css's dark-first
    // tokens). Wrapped in try/catch since localStorage can throw in some
    // browser privacy modes.
    var STORAGE_KEY = 'km-theme';
    var root = document.documentElement;
    var btn = document.getElementById('km-theme-toggle');

    function applyTheme(theme) {
        var use = btn ? btn.querySelector('use') : null;
        if (theme === 'light') {
            root.setAttribute('data-theme', 'light');
            if (use) { use.setAttribute('href', '#icon-moon'); }
            if (btn) { btn.title = 'Switch to dark theme'; }
        } else {
            root.removeAttribute('data-theme');
            if (use) { use.setAttribute('href', '#icon-sun'); }
            if (btn) { btn.title = 'Switch to light theme'; }
        }
    }

    var stored = null;
    try { stored = window.localStorage.getItem(STORAGE_KEY); } catch (e) {}
    applyTheme(stored === 'light' ? 'light' : 'dark');

    if (btn) {
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            applyTheme(next);
            try { window.localStorage.setItem(STORAGE_KEY, next); } catch (e) {}

            // Maps don't follow CSS custom properties (jvectormap bakes
            // its colors in at construction, Google Maps only themes via
            // its `styles:` option), so they need an explicit nudge to
            // pick up the new theme -- see index_charts.js
            // kamRedrawDashboardMap() (dashboard world map) and
            // kamerka_gmaps_theme.js kamReapplyGoogleMapTheme() (device/
            // map/results Google Maps). Both are no-ops/absent on pages
            // that don't have that map, hence the typeof guards.
            try {
                if (typeof window.kamRedrawDashboardMap === 'function') {
                    window.kamRedrawDashboardMap();
                }
            } catch (e) {}
            try {
                if (typeof window.kamReapplyGoogleMapTheme === 'function') {
                    window.kamReapplyGoogleMapTheme();
                }
            } catch (e) {}
        });
    }
})();
</script>
